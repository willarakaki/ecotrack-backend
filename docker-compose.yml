services:
  # Core Transacional Relacional
  oracle-db:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: ecotrack-oracle
    environment:
      - ORACLE_PASSWORD=secret_local_pass
      - APP_USER=ecotrack_admin
      - APP_PASSWORD=secret_local_pass
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mensageria Assíncrona (Eventos de Sustentabilidade) - Versão Fixada
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/bitnami/kafka

  # Event Sourcing para Trilhas de Auditoria (Escopo 3)
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: ecotrack-dynamo
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"

volumes:
  oracle_data:
  kafka_data: