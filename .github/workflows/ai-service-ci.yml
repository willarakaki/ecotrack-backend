name: AI Service CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'ai-service/**'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./ai-service

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest pytest-cov

    - name: Lint with Flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics --exclude=.venv

    - name: Run Tests with Pytest & Coverage
      env:
        GOOGLE_API_KEY: "dummy-key-for-ci"
        LANGCHAIN_API_KEY: "dummy-key-for-ci"
      run: |
        PYTHONPATH=. pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./ai-service/coverage.xml
        flags: ai-service
        name: codecov-ecotrack-ai
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  docker-build-check:
    needs: test-and-lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
        docker build -t ecotrack-ai-worker:test ./ai-service
