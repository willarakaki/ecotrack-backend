name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      # Dependência para os testes de integração (Testcontainers lida com o resto)
      docker:
        image: docker:dind
        options: --privileged

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      # Roda o build e os testes. O Testcontainers vai levantar o LocalStack e o Oracle automaticamente
      run: ./mvnw clean verify -B
